version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tv_oasis_postgres
    restart: always
    environment:
      POSTGRES_USER: oasis_admin
      POSTGRES_PASSWORD: oasis_secret_2026
      POSTGRES_DB: tv_oasis_db
    ports:
      - "5432:5432"
    volumes:
      - oasis_pgdata:/var/lib/postgresql/data
    networks:
      - oasis_network

volumes:
  oasis_pgdata:
    driver: local

networks:
  oasis_network:
    driver: bridge
